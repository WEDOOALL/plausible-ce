# Detection de secrets — gabarit deploye sur les depots sans CI.
#
# POURQUOI CE FICHIER EXISTE
# Le 2026-08-21, deux secrets de production ont ete trouves en clair dans un
# depot, presents depuis deux mois. Les depots equipes d'un scanner le voyaient
# — mais 13 des 26 depots de l'organisation n'en avaient AUCUN, dont celui de
# l'assistant qui accede a la boite mail et au Drive.
#
# POURQUOI LES RUNNERS GITHUB, ET NON LES NOTRES
# Nos runners auto-heberges existent pour ne pas payer de minutes sur les builds
# lourds. Un scan de secrets prend 9 SECONDES (mesure sur FORGE) : le deporter
# n'aurait aucun interet, et aucun de ces 13 depots n'a de runner enregistre —
# le workflow y resterait en attente indefiniment.
#
# BLOQUANT DES LE DEPART
# Ces depots ont ete scannes avant deploiement et sont propres. Il n'y a donc
# aucune raison de commencer en `continue-on-error` : c'est precisement ce
# reglage qui a laisse passer les deux fuites pendant trois mois, en maquillant
# l'echec en coche verte.

name: Secrets

on:
  push:
  pull_request:
  workflow_dispatch:

# Un scan par branche suffit : on annule le precedent s'il tourne encore.
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detection de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Version epinglee, et somme de controle verifiee. Une action tierce non
      # epinglee est un vecteur de compromission de la chaine d'approvisionnement
      # — c'est exactement ce qui est arrive a `trivy-action` (Sprint 7.19).
      - name: Installer Gitleaks
        env:
          VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # `--no-git` scanne l'arbre de travail : c'est ce qui compte pour empecher
      # une NOUVELLE fuite. L'historique se traite separement, il ne se corrige
      # pas en CI.
      - name: Gitleaks
        run: ./gitleaks detect --redact --verbose --no-git --source .
